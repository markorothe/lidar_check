<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Darstellung auf iOS/Android -->
  <meta name="theme-color" content="#eff8e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bananen-Check">

  <title>Bananen-Check</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172018;
      background: #eff8e9;
      overscroll-behavior: none;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));

      background: linear-gradient(
        160deg,
        #fffdf2 0%,
        #eff8e9 100%
      );
    }

    .content {
      width: min(100%, 600px);
      text-align: center;
    }

    .step {
      margin-bottom: 18px;

      color: #67806b;

      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 48px;

      font-size: clamp(32px, 9vw, 58px);
      line-height: 1.08;
    }

    #yesButton {
      width: min(100%, 360px);
      min-height: 76px;

      border: 0;
      border-radius: 18px;

      background: #2d873d;
      color: white;

      font-size: 28px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(45, 135, 61, 0.2);

      transition:
        transform 0.1s ease,
        background-color 0.15s ease;
    }

    #yesButton:hover {
      background: #267535;
    }

    #yesButton:active {
      transform: scale(0.97);
    }

    #yesButton:focus-visible {
      outline: 4px solid #172018;
      outline-offset: 4px;
    }

    .emoji {
      display: none;

      margin-bottom: 28px;

      font-size: clamp(100px, 30vw, 180px);
      line-height: 1;
    }

    .finished .emoji {
      display: block;
    }

    .finished .step,
    .finished #yesButton {
      display: none;
    }

    .finished h1 {
      margin-bottom: 0;
    }

    @media (prefers-color-scheme: dark) {

      body {
        color: #f4f7f2;
        background: #17231a;
      }

      #app {
        background: linear-gradient(
          160deg,
          #1b211b 0%,
          #17231a 100%
        );
      }

      .step {
        color: #9fc4a4;
      }

      #yesButton:focus-visible {
        outline-color: white;
      }
    }
  </style>
</head>

<body>

  <main id="app">

    <section class="content">

      <div id="step" class="step">
        Frage 1 von 3
      </div>

      <div id="emoji" class="emoji" aria-hidden="true">
        🥳
      </div>

      <h1 id="question">
        Warst du schon einkaufen?
      </h1>

      <button id="yesButton" type="button">
        Ja
      </button>

    </section>

  </main>


  <script>
    const questions = [
      "Warst du schon einkaufen?",
      "Gab es Bananen?",
      "Hast du welche gekauft?"
    ];

    let currentQuestion = 0;

    const app = document.getElementById("app");
    const step = document.getElementById("step");
    const question = document.getElementById("question");
    const yesButton = document.getElementById("yesButton");


    yesButton.addEventListener("click", function () {

      currentQuestion++;

      // Noch weitere Fragen vorhanden
      if (currentQuestion < questions.length) {

        step.textContent =
          `Frage ${currentQuestion + 1} von ${questions.length}`;

        question.textContent =
          questions[currentQuestion];

        return;
      }


      // Alle drei Fragen wurden mit Ja bestätigt
      showSuccessPage();

    });


    function showSuccessPage() {

      app.classList.add("finished");

      question.textContent = "Alles geschafft";

      document.title = "Alles geschafft";

    }
  </script>

</body>
</html>
